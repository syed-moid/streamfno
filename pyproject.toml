[project]
name = "streamfno"
version = "0.1.0"
description = "Continuum limits and predictability bounds for backpressure in many-partition streaming systems"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "scipy>=1.14",
    "matplotlib>=3.9",
    "scikit-learn>=1.9.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "python-docx>=1.2.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/streamfno"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests", "experiments"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "NPY"]
